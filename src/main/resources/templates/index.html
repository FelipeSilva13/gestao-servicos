<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | GestãoOS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/layout :: topbar('Dashboard')}"></header>
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Visão geral do sistema de gestão de serviços</p>
          </div>
          <div class="actions">
            <a class="btn" href="/os/nova"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nova OS</a>
            <form th:action="@{/logout}" method="post">
              <button class="btn btn-secondary" type="submit">Sair</button>
            </form>
          </div>
        </div>

        <section class="cards" aria-label="Resumo">
          <article class="card">
            <span class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span>
            <span class="big" th:text="${totalTecnicos}">0</span><span class="muted">Técnicos</span>
          </article>
          <article class="card">
            <span class="card-icon blue"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="big" th:text="${totalClientes}">0</span><span class="muted">Clientes</span>
          </article>
          <article class="card">
            <span class="card-icon yellow"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 12l-2-2 2.7-3.7Z"/></svg></span>
            <span class="big" th:text="${totalServicos}">0</span><span class="muted">Serviços</span>
          </article>
          <article class="card">
            <span class="card-icon green"><svg viewBox="0 0 24 24"><path d="M9 11 12 14 21 5"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg></span>
            <span class="big" th:text="${totalOrdens}">0</span><span class="muted">OS Abertas</span>
          </article>
        </section>

        <section class="panel">
          <div class="panel-heading"><span>Ordens Recentes</span><a href="/os">Ver todas <span aria-hidden="true">→</span></a></div>
          <div th:if="${#lists.isEmpty(ordensRecentes)}" class="empty-state">Nenhuma ordem de serviço cadastrada.</div>
          <div th:each="ordem : ${ordensRecentes}" class="list-row">
            <div>
              <div class="list-title" th:text="${ordem.cliente.nome}">Cliente</div>
              <div class="muted"><span th:text="${'OS-' + ordem.id}">OS-001</span> · <span th:text="${#temporals.format(ordem.dataCriacao, 'dd/MM/yyyy')}">01/08/2026</span></div>
            </div>
            <span class="badge" th:classappend="${ordem.status.name() == 'FINALIZADA'} ? ' success' : (${ordem.status.name() == 'EM_EXECUCAO'} ? ' warning' : '')" th:text="${ordem.status}">PENDENTE</span>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
