<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="sidebar">
  <a class="brand" href="/" aria-label="GestãoOS - Dashboard">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
    </span>
    <span class="brand-copy">GestãoOS<small>Gestão de Serviços</small></span>
  </a>
  <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal"
          onclick="var s=this.closest('.sidebar'),a=s.classList.toggle('menu-aberto');this.setAttribute('aria-expanded',a);this.setAttribute('aria-label',a?'Fechar menu':'Abrir menu')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="menu-toggle-open" d="M4 7h16M4 12h16M4 17h16"/><path class="menu-toggle-close" d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <nav class="menu" id="menu-principal" aria-label="Navegação principal">
    <a href="/" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span>
    </a>
    <a href="/tecnicos" th:classappend="${activePage == 'tecnicos'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span>Técnicos</span>
    </a>
    <a href="/clientes" th:classappend="${activePage == 'clientes'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Clientes</span>
    </a>
    <a href="/servicos" th:classappend="${activePage == 'servicos'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 12l-2-2 2.7-3.7Z"/><path d="m17 4 3 3"/></svg><span>Serviços</span>
    </a>
    <a href="/os" th:classappend="${activePage == 'os'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11 12 14 21 5"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg><span>Ordens de Serviço</span>
    </a>
    <a href="/agenda" th:classappend="${activePage == 'agenda'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2"/></svg><span>Agenda</span>
    </a>
    <a href="/notificacoes" th:classappend="${activePage == 'notificacoes'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Notificações</span>
    </a>
  </nav>
</aside>

<header th:fragment="topbar(pageTitle)" class="topbar">
  <span th:text="${pageTitle}">Dashboard</span>
  <div class="topbar-actions">
    <a th:replace="~{fragments/layout :: sino}"></a>
    <span class="account-mark" aria-label="Conta da empresa">AD</span>
  </div>
</header>

<a th:fragment="sino" class="bell" href="/notificacoes" aria-label="Notificações" title="Notificações">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  <span class="bell-count" data-notificacoes-contador
        th:text="${notificacoesNaoLidas != null and notificacoesNaoLidas > 99} ? '99+' : ${notificacoesNaoLidas != null ? notificacoesNaoLidas : 0}"
        th:hidden="${notificacoesNaoLidas == null or notificacoesNaoLidas == 0}">0</span>
</a>

<!-- Campo de senha com botão para mostrar/ocultar os caracteres digitados -->
<div th:fragment="campoSenha(rotulo, minimo)">
  <label for="senha" th:text="${rotulo}">Senha</label>
  <div class="campo-senha">
    <input id="senha" type="password" name="senha" required autocomplete="new-password" th:attr="minlength=${minimo}">
    <button class="ver-senha" type="button" aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false"
            onclick="var i=this.previousElementSibling,v=i.type==='password';i.type=v?'text':'password';this.setAttribute('aria-pressed',v);this.setAttribute('aria-label',v?'Ocultar senha':'Mostrar senha');this.title=this.getAttribute('aria-label')">
      <svg class="olho-aberto" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="olho-fechado" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </button>
  </div>
</div>

<div th:fragment="alertas">
  <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-error" role="alert" th:text="${erro}"></div>
</div>
</body>
</html>
