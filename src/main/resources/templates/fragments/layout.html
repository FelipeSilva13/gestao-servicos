<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="sidebar">
  <a class="brand" href="/" aria-label="GestãoOS - Dashboard">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
    </span>
    <span class="brand-copy">GestãoOS<small>Gestão de Serviços</small></span>
  </a>
  <nav class="menu" aria-label="Navegação principal">
    <a href="/" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span>
    </a>
    <a href="/tecnicos" th:classappend="${activePage == 'tecnicos'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span>Técnicos</span>
    </a>
    <a href="/clientes" th:classappend="${activePage == 'clientes'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Clientes</span>
    </a>
    <a href="/servicos" th:classappend="${activePage == 'servicos'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 12l-2-2 2.7-3.7Z"/><path d="m17 4 3 3"/></svg><span>Serviços</span>
    </a>
    <a href="/os" th:classappend="${activePage == 'os'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11 12 14 21 5"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg><span>Ordens de Serviço</span>
    </a>
  </nav>
</aside>

<header th:fragment="topbar(pageTitle)" class="topbar">
  <span th:text="${pageTitle}">Dashboard</span>
  <span class="account-mark" aria-label="Conta administradora">AD</span>
</header>
</body>
</html>
