<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="sidebar">
  <a class="brand" href="/tecnico" aria-label="Área do Técnico - início">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
    </span>
    <span class="brand-copy">GestãoOS<small>Área do Técnico</small></span>
  </a>
  <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-tecnico"
          onclick="var s=this.closest('.sidebar'),a=s.classList.toggle('menu-aberto');this.setAttribute('aria-expanded',a);this.setAttribute('aria-label',a?'Fechar menu':'Abrir menu')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="menu-toggle-open" d="M4 7h16M4 12h16M4 17h16"/><path class="menu-toggle-close" d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <nav class="menu" id="menu-tecnico" aria-label="Navegação do técnico">
    <a href="/tecnico" th:classappend="${activePage == 'painel'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 12l-2-2 2.7-3.7Z"/></svg><span>Meus atendimentos</span>
    </a>
    <a href="/notificacoes" th:classappend="${activePage == 'notificacoes'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Notificações</span>
    </a>
  </nav>
  <div class="menu-footer">
    <form th:action="@{/logout}" method="post"><button class="btn btn-secondary" type="submit">Sair</button></form>
  </div>
</aside>

<header th:fragment="topbar(pageTitle)" class="topbar">
  <span th:text="${pageTitle}">Área do Técnico</span>
  <div class="topbar-actions">
    <a th:replace="~{fragments/layout :: sino}"></a>
    <form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Sair</button></form>
  </div>
</header>
</body>
</html>
