<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordens de Serviço | GestãoOS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('os')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/layout :: topbar('Ordens de Serviço')}"></header>
      <div class="page-content">
        <div class="page-header">
          <div><h1 class="page-title">Ordens de Serviço</h1><p class="page-subtitle" th:text="|${#lists.size(ordens)} ordens registradas|">Ordens registradas</p></div>
          <div class="actions"><a class="btn" href="/os/nova"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nova OS</a></div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Nº OS</th><th>Cliente</th><th>Técnico</th><th>Serviço</th><th>Status</th><th>Abertura</th></tr></thead>
            <tbody>
              <tr th:each="o : ${ordens}">
                <td class="accent-cell" th:text="${'OS-' + #numbers.formatInteger(o.id, 3)}">OS-001</td>
                <td class="primary-cell" th:text="${o.cliente != null ? o.cliente.nome : ''}">Cliente</td>
                <td th:text="${o.tecnico != null ? o.tecnico.nome : ''}">Técnico</td>
                <td class="muted-cell" th:text="${o.servico != null ? o.servico.descricao : ''}">Serviço</td>
                <td>
                  <form th:action="@{/os/{id}/status(id=${o.id})}" method="post">
                    <select name="status" onchange="this.form.submit()" aria-label="Alterar status da ordem de serviço">
                      <option th:each="status : ${StatusOS}" th:value="${status}" th:text="${status}" th:selected="${status == o.status}"></option>
                    </select>
                  </form>
                </td>
                <td class="muted-cell" th:text="${#temporals.format(o.dataCriacao, 'dd/MM/yyyy')}">01/08/2026</td>
              </tr>
              <tr th:if="${#lists.isEmpty(ordens)}"><td colspan="6" class="empty-state">Nenhuma ordem de serviço cadastrada.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
