<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ordens de Serviço</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="badge">GS</div><div class="name">GestãoOS</div></div>
      <nav class="menu">
        <a href="/">Dashboard</a>
        <a href="/tecnicos">Técnicos</a>
        <a href="/clientes">Clientes</a>
        <a href="/servicos">Serviços</a>
        <a class="active" href="/os">Ordens de Serviço</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-header">
        <div class="page-title">Ordens de Serviço</div>
        <div class="actions"><a class="btn" href="/os/nova">+ Nova OS</a></div>
      </div>

      <div class="panel">
        <div th:each="o : ${ordens}" class="list-row">
          <div>
            <div class="list-title" th:text="${o.cliente != null ? o.cliente.nome : ''}"></div>
            <div class="muted" th:text="'OS-' + ${o.id} + ' · ' + ${#temporals.format(o.dataCriacao, 'dd/MM/yyyy HH:mm')}"></div>
          </div>
          <div style="text-align:right">
            <div class="muted" th:text="${o.servico != null ? o.servico.descricao : ''}"></div>
            <form th:action="@{/os/{id}/status(id=${o.id})}" method="post" style="margin-top:8px">
              <select name="status" onchange="this.form.submit()" aria-label="Alterar status da ordem de serviço">
                <option th:each="status : ${StatusOS}" th:value="${status}" th:text="${status}"
                        th:selected="${status == o.status}"></option>
              </select>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>
</body>
</html>
