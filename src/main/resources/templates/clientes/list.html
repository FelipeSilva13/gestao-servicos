  <!DOCTYPE html>
  <html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | GestãoOS</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
  </head>
  <body>
    <div class="app">
      <aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>
      <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Clientes')}"></header>
        <div class="page-content">
          <div class="page-header">
            <div><h1 class="page-title">Clientes</h1><p class="page-subtitle" th:text="|${#lists.size(clientes)} clientes cadastrados|">Clientes cadastrados</p></div>
            <div class="actions"><a class="btn" href="/clientes/novo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo Cliente</a></div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Endereço</th><th class="row-actions">Ações</th></tr></thead>
              <tbody>
                <tr th:each="c : ${clientes}">
                  <td class="primary-cell" th:text="${c.nome}">Cliente</td>
                  <td class="muted-cell" th:text="${c.email}">cliente@empresa.com</td>
                  <td class="muted-cell" th:text="${c.telefone}">(11) 98765-4321</td>
                  <td th:text="${c.endereco}">Endereço</td>
                  <td class="row-actions">
                    <a class="icon-button" th:href="@{'/clientes/' + ${c.id} + '/editar'}" aria-label="Editar cliente" title="Editar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></a>
                    <form th:action="@{/clientes/{id}/excluir(id=${c.id})}" method="post"><button class="icon-button danger" type="submit" aria-label="Excluir cliente" title="Excluir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button></form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="empty-state">Nenhum cliente cadastrado.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </body>
  </html>
