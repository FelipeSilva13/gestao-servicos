<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cliente | GestãoOS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/layout :: topbar('Clientes')}"></header>
      <div class="page-content">
        <div class="page-header"><div><h1 class="page-title" th:text="${cliente.id} == null ? 'Novo Cliente' : 'Editar Cliente'">Cliente</h1><p class="page-subtitle">Dados de contato e identificação</p></div></div>
        <section class="form-panel">
          <form th:action="${cliente.id} == null ? '/clientes' : '/clientes/' + ${cliente.id}" method="post">
            <div class="grid">
              <label>Nome<input type="text" name="nome" th:value="${cliente.nome}" autocomplete="name" required></label>
              <label>Email<input type="email" name="email" th:value="${cliente.email}" autocomplete="email" required></label>
              <label>Telefone<input type="text" name="telefone" th:value="${cliente.telefone}" placeholder="(11) 91234-5678" autocomplete="tel" inputmode="tel"></label>
              <label>Endereço<input type="text" name="endereco" th:value="${cliente.endereco}" autocomplete="street-address"></label>
            </div>
            <div class="form-actions"><button class="btn" type="submit">Salvar cliente</button><a class="btn btn-secondary" href="/clientes">Cancelar</a></div>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
