<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços | GestãoOS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('servicos')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/layout :: topbar('Serviços')}"></header>
      <div class="page-content">
        <div class="page-header">
          <div><h1 class="page-title">Serviços</h1><p class="page-subtitle" th:text="|${#lists.size(servicos)} serviços cadastrados|">Serviços cadastrados</p></div>
          <div class="actions"><a class="btn" href="/servicos/novo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo Serviço</a></div>
        </div>
        <div th:if="${#lists.isEmpty(servicos)}" class="panel empty-state">Nenhum serviço cadastrado.</div>
        <div class="service-grid">
          <article th:each="s : ${servicos}" class="service-card">
            <h4 th:text="${s.descricao}">Descrição do serviço</h4>
            <p th:text="${s.tipo}">Tipo de serviço</p>
            <div class="service-meta">
              <div><small>Preço</small><span th:text="${'R$ ' + s.custo}">R$ 0,00</span></div>
              <div><small>Duração</small><span th:text="${s.tempoEstimadoMinutos + ' h'}">0 h</span></div>
            </div>
            <div class="actions">
              <a class="btn btn-secondary" th:href="@{/servicos/{id}/editar(id=${s.id})}">Editar</a>
              <form th:action="@{/servicos/{id}/excluir(id=${s.id})}" method="post"><button class="btn btn-danger" type="submit">Excluir</button></form>
            </div>
          </article>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
