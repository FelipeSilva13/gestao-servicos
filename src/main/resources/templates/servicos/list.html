<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Serviços</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="badge">GS</div><div class="name">GestãoOS</div></div>
      <nav class="menu">
        <a href="/">Dashboard</a>
        <a href="/tecnicos">Técnicos</a>
        <a href="/clientes">Clientes</a>
        <a class="active" href="/servicos">Serviços</a>
        <a href="/os">Ordens de Serviço</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-header">
        <div class="page-title">Serviços</div>
        <div class="actions"><a class="btn" href="/servicos/novo">+ Novo Serviço</a></div>
      </div>

      <div class="service-grid">
        <div th:each="s : ${servicos}" class="service-card">
          <h4 th:text="${s.descricao}"></h4>
          <p th:text="${s.descricao}"></p>
          <div style="display:flex;justify-content:space-between;margin-top:12px">
            <div><strong th:text="${s.preco}"></strong></div>
            <div class="muted" th:text="${s.duracao}"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</body>
</html>
