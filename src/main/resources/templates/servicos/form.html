<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviço | GestãoOS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('servicos')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/layout :: topbar('Serviços')}"></header>
      <div class="page-content">
        <div class="page-header"><div><h1 class="page-title" th:text="${servico.id} == null ? 'Novo Serviço' : 'Editar Serviço'">Serviço</h1><p class="page-subtitle">Descrição, preço e duração do serviço</p></div></div>
        <section class="form-panel">
          <form class="grid" th:action="${servico.id} == null ? '/servicos' : '/servicos/' + ${servico.id}" method="post">
            <label>Descrição<input type="text" name="descricao" th:value="${servico.descricao}" required></label>
            <label>Tipo<input type="text" name="tipo" th:value="${servico.tipo}"></label>
            <label>Custo<input type="number" step="0.01" min="0" name="custo" th:value="${servico.custo}" inputmode="decimal"></label>
            <label>Tempo estimado (minutos)<input type="number" min="1" name="tempoEstimadoMinutos" th:value="${servico.tempoEstimadoMinutos}" required></label>
            <div class="form-actions"><button class="btn" type="submit">Salvar serviço</button><a class="btn btn-secondary" href="/servicos">Cancelar</a></div>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
