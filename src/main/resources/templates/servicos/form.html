<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Serviço</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="badge">GS</div><div class="name">GestãoOS</div></div>
      <nav class="menu">
        <a href="/">Dashboard</a>
        <a href="/tecnicos">Técnicos</a>
        <a href="/clientes">Clientes</a>
        <a class="active" href="/servicos">Serviços</a>
        <a href="/os">Ordens de Serviço</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-header">
        <div class="page-title">Serviço</div>
      </div>

      <div class="panel card">
        <form class="grid" th:action="${servico.id} == null ? '/servicos' : '/servicos/' + ${servico.id}" method="post">
          <label>Descrição
            <input type="text" name="descricao" th:value="${servico.descricao}" required>
          </label>
          <label>Tipo
            <input type="text" name="tipo" th:value="${servico.tipo}">
          </label>
          <label>Custo
            <input type="number" step="0.01" name="custo" th:value="${servico.custo}">
          </label>
          <label>Duração (ex: 2h)
            <input type="text" name="duracao" th:value="${servico.duracao}">
          </label>
          <div class="actions">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="/servicos">Voltar</a>
          </div>
        </form>
      </div>

    </main>
  </div>
</body>
</html>
