<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Técnico | GestãoOS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('tecnicos')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/layout :: topbar('Técnicos')}"></header>
      <div class="page-content">
        <div class="page-header"><div><h1 class="page-title" th:text="${tecnico.id} == null ? 'Novo Técnico' : 'Editar Técnico'">Técnico</h1><p class="page-subtitle">Dados de contato e especialidade</p></div></div>
        <section class="form-panel">
          <form class="grid" th:action="${tecnico.id} == null ? '/tecnicos' : '/tecnicos/' + ${tecnico.id}" method="post">
            <label>Nome<input type="text" name="nome" th:value="${tecnico.nome}" autocomplete="name" required></label>
            <label>Email<input type="email" name="email" th:value="${tecnico.email}" autocomplete="email" required></label>
            <label>Telefone<input type="tel" name="telefone" th:value="${tecnico.telefone}" placeholder="(11) 98765-4321" maxlength="11" inputmode="numeric" autocomplete="tel"></label>
            <label>Especialidade<input type="text" name="especialidade" th:value="${tecnico.especialidade}"></label>
            <label>Disponível<input type="checkbox" name="disponivel" th:checked="${tecnico.disponivel}"></label>
            <div class="form-actions"><button class="btn" type="submit">Salvar técnico</button><a class="btn btn-secondary" href="/tecnicos">Cancelar</a></div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script th:src="@{/js/telefone.js}"></script>
</body>
</html>
