<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Técnicos</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="badge">GS</div><div class="name">GestãoOS</div></div>
      <nav class="menu">
        <a href="/">Dashboard</a>
        <a class="active" href="/tecnicos">Técnicos</a>
        <a href="/clientes">Clientes</a>
        <a href="/servicos">Serviços</a>
        <a href="/os">Ordens de Serviço</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-header">
        <div class="page-title">Técnicos</div>
        <div class="actions"><a class="btn" href="/tecnicos/novo">+ Novo Técnico</a></div>
      </div>

      <div class="panel">
        <div th:each="t : ${tecnicos}" class="list-row">
          <div>
            <div class="list-title" th:text="${t.nome}"></div>
            <div class="muted" th:text="${t.especialidade}"></div>
          </div>
          <div style="text-align:right">
            <div th:text="${t.telefone}"></div>
            <div class="muted" th:text="${t.email}"></div>
            <div style="margin-top:8px">
              <a class="btn btn-secondary" th:href="@{'/tecnicos/' + ${t.id} + '/editar'}">Editar</a>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</body>
</html>
