spring.application.name=gestao_servicos

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_servicos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
# Anexos das ordens de serviÃ§o (fotos, documentos, vÃ­deos)
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:100MB}
