services:

  database:
    image: postgres:13
    container_name: gestao_servicos_database

    ports:
      - "5432:5432"

    environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
     POSTGRES_DB: gestao_servicos

    volumes:
      - gestao_servicos-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_servicos"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: gestao_servicos

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/gestao_servicos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3003,http://localhost:5176,http://localhost:4176

    ports:
      - "8080:8080"

    depends_on:
      database:
        condition: service_healthy


volumes:
  gestao_servicos-data:
